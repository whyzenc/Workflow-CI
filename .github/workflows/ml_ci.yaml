name: MLflow CI and Docker Build Melbourne

on:
  push:
    branches: [ "main" ]

jobs:
  build-train-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # INSTALL PREREQUISITES
    - name: Install Dependencies
      run: |
        pip install mlflow pandas numpy scikit-learn

    # JALANKAN MLFLOW TRAINING LOKAL DI RUNNER
    - name: Run MLflow Project (Training Model Melbourne)
      run: |
        export MLFLOW_TRACKING_URI="file://$(pwd)/mlruns"
        # Menjalankan script modelling.py yang berada di dalam folder MLProject
        python MLProject/modelling.py --n_estimators 100 --max_depth 15

    # LOGIN DOCKER HUB
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # AMBIL RUN ID TERBARU & BUILD DOCKER
    - name: Get MLflow Run ID, Build, & Push
      run: |
        export MLFLOW_TRACKING_URI="file://$(pwd)/mlruns"
        # Mencari Run ID dari nama eksperimen Melbourne Anda
        RUN_ID=$(python -c "import mlflow; runs=mlflow.search_runs(experiment_names=['Eksperimen_Prediksi_Harga_Melbourne_Whenny']); print(runs.iloc[0].run_id)")
        echo "Ditemukan Run ID Proyek Whenny: $RUN_ID"
        
        # Build Docker Image menggunakan model Random Forest terbaik Anda
        mlflow models build-docker -m "runs:/$RUN_ID/random_forest_model" -n "${{ secrets.DOCKERHUB_USERNAME }}/melbourne-housing-model:latest"
        
        # Push ke Docker Hub Anda
        docker push "${{ secrets.DOCKERHUB_USERNAME }}/melbourne-housing-model:latest"
        
    # SIMPAN OTOMATIS ARTIFACT LOG KE REPO GITHUB
    - name: Commit and push MLflow artifacts
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-save MLflow artifacts to repo [skip ci]"
        file_pattern: 'mlruns/**'