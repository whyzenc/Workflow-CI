name: CI - MLflow Training & Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Training Model dengan MLflow Project
  # ─────────────────────────────────────────────
  train:
    name: Train Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.2 mlflow==2.22.0

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: mlruns
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Debug - Tampilkan struktur mlruns
        run: find MLProject/mlruns -type f | sort

      - name: Upload MLflow Artifact ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-whenny
          path: MLProject/mlruns/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker Image ke Docker Hub
  # ─────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLflow
        run: pip install mlflow==2.22.0

      - name: Download MLflow Artifact dari Job Train
        uses: actions/download-artifact@v4
        with:
          name: mlflow-runs-whenny
          path: MLProject/mlruns/

      - name: Debug - Tampilkan struktur mlruns
        run: find MLProject/mlruns -type f | sort

      - name: Cari path model artifact
        id: find_model
        run: |
          MODEL_PATH=$(find MLProject/mlruns -name "MLmodel" -path "*/artifacts/*" | head -1 | xargs -I{} dirname {})
          if [ -z "$MODEL_PATH" ]; then
            echo "MLmodel tidak ditemukan, coba cari artifacts folder..."
            MODEL_PATH=$(find MLProject/mlruns -type d -name "artifacts" | head -1)
            MODEL_PATH="$MODEL_PATH/model"
          fi
          echo "Model path: $MODEL_PATH"
          echo "model_path=$MODEL_PATH" >> $GITHUB_OUTPUT

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image dengan MLflow
        run: |
          mlflow models build-docker \
            --model-uri "${{ steps.find_model.outputs.model_path }}" \
            --name ${{ secrets.DOCKERHUB_USERNAME }}/melbourne-housing-whenny

      - name: Push Docker Image ke Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/melbourne-housing-whenny:latest