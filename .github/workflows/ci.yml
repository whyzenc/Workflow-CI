name: CI - MLflow Training & Docker Build

on:
  push:
    branches:
      - main
    paths:
      - "MLProject/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    name: Train Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.2 mlflow==2.22.0

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . \
            --env-manager=local \
            --experiment-name="Eksperimen_Prediksi_Harga_Melbourne_Whenny"

      - name: Debug - Tampilkan struktur mlruns
        run: find MLProject/mlruns -type f | sort

      - name: Simpan Run ID & Commit ke Repo
        run: |
          RUN_ID=$(cd MLProject && python3 -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          exp = client.get_experiment_by_name('Eksperimen_Prediksi_Harga_Melbourne_Whenny')
          if exp is None:
              raise ValueError('Experiment tidak ditemukan')
          runs = client.search_runs(
              [exp.experiment_id],
              order_by=['start_time DESC']
          )
          print(runs[0].info.run_id)
          ")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "$RUN_ID" > MLProject/run_id.txt

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add -f mlruns/ || true
          git add MLProject/run_id.txt || true
          git diff --staged --quiet \
            || git commit -m "ci: update run_id [skip ci]"
          git pull --rebase origin main || true
          git push

      - name: Upload MLflow Artifact ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-whenny
          path: MLProject/mlruns/
          retention-days: 30

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MLflow Artifact dari Job Train
        uses: actions/download-artifact@v4
        with:
          name: mlflow-runs-whenny
          path: MLProject/mlruns/

      - name: Debug - Tampilkan struktur mlruns
        run: find MLProject/mlruns -type f | sort

      - name: Cari path model artifact
        id: find_model
        run: |
          MLMODEL_FILE=$(find MLProject/mlruns -name "MLmodel" | head -1)
          echo "MLmodel ditemukan: $MLMODEL_FILE"

          if [ -z "$MLMODEL_FILE" ]; then
            echo "ERROR: MLmodel tidak ditemukan!"
            exit 1
          fi

          MODEL_PATH=$(dirname "$MLMODEL_FILE")
          echo "Model path: $MODEL_PATH"
          echo "model_path=$MODEL_PATH" >> $GITHUB_OUTPUT

      - name: Buat Dockerfile
        run: |
          MODEL_PATH="${{ steps.find_model.outputs.model_path }}"
          mkdir -p docker_build
          cp -r "$MODEL_PATH" docker_build/model

          cat > docker_build/Dockerfile << 'DOCKEREOF'
          FROM python:3.11-slim
          WORKDIR /app
          RUN pip install --upgrade pip

          RUN pip install --no-cache-dir \
            mlflow==2.22.0 \
            fastapi==0.115.0 \
            starlette==0.38.6 \
            uvicorn==0.30.6 \
            scikit-learn==1.5.2 \
            pandas==2.2.2 \
            numpy==1.26.4
          COPY model /app/model
          EXPOSE 5000
          CMD ["mlflow", "models", "serve", \
               "-m", "/app/model", \
               "--host", "0.0.0.0", \
               "--port", "5000", \
               "--no-conda"]
          DOCKEREOF

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: docker_build
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/melbourne-housing-whenny:latest

      - name: Update Tautan_DockerHub.txt & Commit
        run: |
          echo "https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/melbourne-housing-whenny" \
            > MLProject/Tautan_DockerHub.txt

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add MLProject/Tautan_DockerHub.txt
          git diff --staged --quiet \
            || git commit -m "ci: update Docker Hub link [skip ci]"
          git pull --rebase origin main || true
          git push

      - name: Tampilkan link Docker Hub
        run: |
          echo "Docker image berhasil dipush:"
          echo "https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/melbourne-housing-whenny"
